name: Validate Pondside

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript module syntax
        run: node --input-type=module --check < src/main.js
      - name: Check required entry files
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
